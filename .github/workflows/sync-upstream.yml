name: Sync upstream

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'drewhamlett/opencode'
    runs-on: ubuntu-latest
    steps:
      - name: Check out compact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: compact-tui

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev

          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git merge --no-edit upstream/dev
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        if: steps.merge.outputs.updated == 'true'
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      - name: Typecheck TUI
        if: steps.merge.outputs.updated == 'true'
        run: bun run --cwd packages/tui typecheck

      - name: Test TUI prompt
        if: steps.merge.outputs.updated == 'true'
        working-directory: packages/tui
        run: bun test test/cli/tui/prompt-submit-race.test.ts test/cli/tui/dialog-prompt.test.tsx

      - name: Push update
        if: steps.merge.outputs.updated == 'true'
        run: git push origin HEAD:compact-tui
